<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8f1f4" />
  <title>Doctor login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="page page-patient">
    <header class="header">
      <p class="brand">Doctor desk</p>
      <p class="tagline">Sign in to review bookings, ask AI, and download Excel.</p>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-list">
          {% for category, message in messages %}
            <li class="flash flash-{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <section class="panel panel-patient">
      <h2>Password</h2>
      <form method="post" class="form">
        <label>
          Doctor password
          <input type="password" name="password" required placeholder="Enter password" autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-secondary">Sign in</button>
      </form>
    </section>
  </div>
</body>
</html>
